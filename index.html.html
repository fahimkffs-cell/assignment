<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future-Ready AI Skills - Final Examination</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef2f7;color:#172033}
.header{background:#182b50;color:white;text-align:center;padding:30px 16px}
.header-logo{width:120px;height:120px;object-fit:contain;border-radius:18px;margin:0 auto 12px;display:block}.hub-name{font-size:22px;font-weight:800;margin:0 0 10px}.header h1{margin:0 0 8px;font-size:28px}
.header p{margin:5px;font-size:15px}
.wrap{max-width:900px;margin:24px auto;padding:0 14px}
.card{background:#fff;border-radius:12px;padding:22px;margin:16px 0;box-shadow:0 3px 12px rgba(0,0,0,.07)}
h2{color:#182b50}
.info{display:grid;grid-template-columns:1fr 1fr;gap:15px}
label.title{display:block;font-weight:bold;margin-bottom:7px}
input[type=text]{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:7px;font-size:16px}
.section{background:#182b50;color:#fff;border-radius:10px;padding:14px 18px;margin:25px 0 12px;font-size:19px;font-weight:bold}
.question{font-size:17px;font-weight:bold;line-height:1.5;margin-bottom:13px}
.option{display:block;padding:12px;border:1px solid #d6dce5;border-radius:8px;margin:8px 0;cursor:pointer}
.option:hover{background:#f3f7ff}
.option input{margin-right:10px}
.progressBox{position:sticky;top:0;background:white;padding:10px 0;z-index:10}
.progress{height:8px;background:#dbe2ea;border-radius:10px;overflow:hidden}
.progressBar{height:100%;width:0;background:#2563eb}
button{width:100%;padding:15px;border:0;border-radius:8px;background:#2563eb;color:white;font-size:17px;font-weight:bold;cursor:pointer}
button:hover{background:#1d4ed8}
.result{text-align:center;display:none}
.score{font-size:52px;font-weight:bold;color:#182b50;margin:15px}
.pass{font-size:24px;font-weight:bold;color:#15803d}
.fail{font-size:24px;font-weight:bold;color:#b91c1c}
.note{color:#64748b;font-size:13px}
@media(max-width:650px){.info{grid-template-columns:1fr}.header h1{font-size:22px}.card{padding:17px}}
</style>
</head>

const questionContainer = document.getElementById("questions");

function createQuestion(item, index) {
    const card = document.createElement("div");
    card.className = "card";

    const question = document.createElement("div");
    question.className = "question";
    question.textContent = (index + 1) + ". " + item[0];
    card.appendChild(question);

    item[1].forEach(function(optionText, optionIndex) {
        const label = document.createElement("label");
        label.className = "option";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "question" + index;
        radio.value = optionIndex;
        radio.required = true;

        label.appendChild(radio);
        label.appendChild(document.createTextNode(
            String.fromCharCode(65 + optionIndex) + ". " + optionText
        ));

        card.appendChild(label);
    });

    questionContainer.appendChild(card);
}

questions.forEach(function(item, index) {
    if (index === 0) addSection("PART A - AI FOUNDATIONS");
    if (index === 10) addSection("PART B - THINKING MODE & DEEP RESEARCH");
    if (index === 25) addSection("PART C - CLAUDE PROJECTS");
    if (index === 36) addSection("PART D - CLAUDE COWORK & AI WORKFLOWS");
    createQuestion(item, index);
});

function addSection(title) {
    const section = document.createElement("div");
    section.className = "section";
    section.textContent = title;
    questionContainer.appendChild(section);
}

document.addEventListener("change", function() {
    const answered = document.querySelectorAll('input[type="radio"]:checked').length;
    document.getElementById("progressText").textContent = answered + " / 40 answered";
    document.getElementById("progressBar").style.width = (answered / 40 * 100) + "%";
});

document.getElementById("exam").addEventListener("submit", function(event) {
    event.preventDefault();

    let score = 0;

    questions.forEach(function(item, index) {
        const selected = document.querySelector('input[name="question' + index + '"]:checked');
        if (selected && Number(selected.value) === item[2]) {
            score++;
        }
    });

    const name = document.getElementById("studentName").value;
    const reg = document.getElementById("regNo").value;

    document.getElementById("exam").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("studentDetails").innerHTML =
        "<strong>" + escapeHTML(name) + "</strong><br>Registration No.: " + escapeHTML(reg);

    document.getElementById("score").textContent = score + " / 40";

    if (score >= 32) {
        document.getElementById("status").innerHTML = '<div class="pass">PASS</div>';
    } else {
        document.getElementById("status").innerHTML = '<div class="fail">NOT PASS</div>';
    }

    document.getElementById("percentage").textContent =
        "Percentage: " + Math.round(score / 40 * 100) + "% | Pass mark: 32 / 40 (80%)";

    window.scrollTo({top:0, behavior:"smooth"});
});

    return value.replace(/[&<>"']/g, function(char) {
        const map = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"};
        return map[char];
    });
}
</script>
